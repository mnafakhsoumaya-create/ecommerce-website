<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — DZ Dépannage</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="auth-page">
  <div class="auth-box" style="width:500px;">
    <div class="auth-logo"><span class="logo-dz" style="font-size:38px;">DZ</span></div>
    <h2 class="auth-title">Créer un Compte</h2>
    <p class="auth-sub">Inscrivez-vous pour suivre vos interventions</p>
    <div id="regAlert"></div>
    <div class="form-row">
      <div class="form-group"><label>Prénom</label><input type="text" id="rFname" placeholder="Prénom"></div>
      <div class="form-group"><label>Nom</label><input type="text" id="rLname" placeholder="Nom"></div>
    </div>
    <div class="form-group"><label>Email</label><input type="email" id="rEmail" placeholder="votre@email.com"></div>
    <div class="form-group"><label>Téléphone</label><input type="tel" id="rPhone" placeholder="0X XX XX XX XX"></div>
    <div class="form-group"><label>Mot de passe</label><input type="password" id="rPwd" placeholder="Minimum 4 caractères"></div>
    <div class="form-group"><label>Confirmer</label><input type="password" id="rPwd2" placeholder="Répétez"></div>
    <button class="btn-login" onclick="doRegister()">👤 Créer mon Compte</button>
    <div class="auth-link-text">Déjà inscrit ? <a href="login.html">Se connecter</a></div>
  </div>
</div>
<script src="../js/main.js"></script>
<script>
if (DZ.currentClient()) window.location.href = 'dashboard.html';
function doRegister() {
  const fname = document.getElementById('rFname').value.trim();
  const lname = document.getElementById('rLname').value.trim();
  const email = document.getElementById('rEmail').value.trim();
  const phone = document.getElementById('rPhone').value.trim();
  const pwd   = document.getElementById('rPwd').value;
  const pwd2  = document.getElementById('rPwd2').value;
  const al    = document.getElementById('regAlert');
  if (!fname||!lname||!email||!phone||!pwd) { al.innerHTML='<div class="alert alert-error">⚠️ Remplissez tous les champs.</div>'; return; }
  if (pwd !== pwd2) { al.innerHTML='<div class="alert alert-error">❌ Mots de passe différents.</div>'; return; }
  if (pwd.length < 4) { al.innerHTML='<div class="alert alert-error">❌ Mot de passe trop court.</div>'; return; }
  const ok = DZ.registerClient({ name: fname+' '+lname, email, phone, password: pwd });
  if (ok) { DZ.setClient(DZ.loginClient(email, pwd)); window.location.href = 'dashboard.html'; }
  else al.innerHTML = '<div class="alert alert-error">❌ Email déjà utilisé.</div>';
}
</script>
</body>
</html>
