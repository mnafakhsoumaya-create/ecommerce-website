<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — DZ Dépannage</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="auth-page">
  <div class="auth-box">
    <div style="text-align:center;margin-bottom:14px;">
      <div class="admin-badge-tag">🛡️ Accès Administrateur</div>
    </div>
    <div class="auth-logo"><span class="logo-dz" style="font-size:40px;">DZ</span></div>
    <h2 class="auth-title">Panneau Admin</h2>
    <p class="auth-sub">Connectez-vous pour gérer le site</p>
    <div class="admin-creds-box">
      <h4>🔑 Identifiants</h4>
      <div class="cred-row"><span>Admin 1 :</span><strong>admin1 / dzdepannage@2024</strong></div>
      <div class="cred-row" style="margin-top:6px;"><span>Admin 2 :</span><strong>admin2 / depannage@2024</strong></div>
    </div>
    <div id="adminAlert"></div>
    <div class="form-group"><label>Nom d'utilisateur</label><input type="text" id="aUser" placeholder="admin1 ou admin2"></div>
    <div class="form-group"><label>Mot de passe</label><input type="password" id="aPwd" placeholder="••••••••••••"></div>
    <button class="btn-login" onclick="doLogin()">🔓 Accéder au Panneau</button>
    <div class="auth-link-text" style="margin-top:18px;"><a href="../index.html">← Retour au Site</a></div>
  </div>
</div>
<script src="../js/main.js"></script>
<script>
if (DZ.currentAdmin()) window.location.href = 'dashboard.html';
function doLogin() {
  const u  = document.getElementById('aUser').value.trim();
  const p  = document.getElementById('aPwd').value;
  const al = document.getElementById('adminAlert');
  if (!u || !p) { al.innerHTML='<div class="alert alert-error">⚠️ Remplissez tous les champs.</div>'; return; }
  const admin = DZ.loginAdmin(u, p);
  if (admin) { DZ.setAdmin(admin); window.location.href = 'dashboard.html'; }
  else al.innerHTML = '<div class="alert alert-error">❌ Identifiants incorrects.</div>';
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
