<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Client — DZ Dépannage</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="toast" id="toast"></div>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo"><span class="logo-dz" style="font-size:40px;">DZ</span></div>
    <h2 class="auth-title">Espace Client</h2>
    <p class="auth-sub">Connectez-vous pour suivre vos commandes</p>
    <div class="demo-box"><strong>Compte démo :</strong> ahmed@test.com / 1234</div>
    <div id="loginAlert"></div>
    <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="votre@email.com"></div>
    <div class="form-group"><label>Mot de passe</label><input type="password" id="loginPwd" placeholder="••••••••"></div>
    <button class="btn-login" onclick="doLogin()">🔑 Se Connecter</button>
    <div class="auth-link-text">Pas encore de compte ? <a href="register.html">S'inscrire</a></div>
    <div class="auth-link-text" style="margin-top:8px;"><a href="../index.html">← Retour Accueil</a></div>
  </div>
</div>
<script src="../js/main.js"></script>
<script>
if (DZ.currentClient()) window.location.href = 'dashboard.html';
function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pwd   = document.getElementById('loginPwd').value;
  const alertEl = document.getElementById('loginAlert');
  if (!email || !pwd) { alertEl.innerHTML = '<div class="alert alert-error">⚠️ Remplissez tous les champs.</div>'; return; }
  const client = DZ.loginClient(email, pwd);
  if (client) { DZ.setClient(client); window.location.href = 'dashboard.html'; }
  else alertEl.innerHTML = '<div class="alert alert-error">❌ Email ou mot de passe incorrect.</div>';
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
